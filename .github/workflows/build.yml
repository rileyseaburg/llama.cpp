name: CUDA Build

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - master
    paths: ['.github/workflows/build.yml', '.devops/cuda.Dockerfile', 'grammars/code.gbnf']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  packages: write
  contents: read

jobs:
  ubuntu-cuda-build:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.2-devel-ubuntu24.04

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt update
          apt install -y cmake build-essential ninja-build libgomp1 git zip

      - name: Build with CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=89-real -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined -DLLAMA_FATAL_WARNINGS=ON
          cmake --build build

      - name: Package binaries
        run: |
          mkdir -p dist
          cp build/bin/* dist/
          zip -r llama-cuda-binaries.zip dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cuda-binaries
          path: llama-cuda-binaries.zip

  docker-build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [ubuntu-cuda-build]  # Ensure CUDA build succeeds first
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CUDA Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devops/cuda.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/llama-cuda:latest
            ghcr.io/${{ github.repository_owner }}/llama-cuda:${{ github.sha }}
          build-args: |
            CUDA_VERSION=12.6.0
